<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Adventure Planner mark: a compass star on warm ink, with a gold halo -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1A1713"/>
      <stop offset="65%" stop-color="#0F0D0A"/>
      <stop offset="100%" stop-color="#0A0806"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C59A"/>
      <stop offset="55%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#9F7F58"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF9F2"/>
      <stop offset="100%" stop-color="#E8DDCB"/>
    </linearGradient>
  </defs>

  <!-- Rounded ink background (works for both standard + maskable) -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle gold ring -->
  <circle cx="256" cy="256" r="174" fill="none" stroke="url(#gold)" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Compass star (4-point editorial mark) -->
  <g transform="translate(256 256)">
    <!-- vertical needle: cream -->
    <polygon points="0,-150 22,0 0,150 -22,0" fill="url(#cream)"/>
    <!-- horizontal accent: gold -->
    <polygon points="-150,0 0,18 150,0 0,-18" fill="url(#gold)"/>
    <!-- core dot -->
    <circle r="11" fill="#0A0806"/>
    <circle r="6" fill="url(#gold)"/>
  </g>

</svg>
