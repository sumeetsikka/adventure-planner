<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Must be PNG: iOS Safari ignores SVG here and falls back to a screenshot
         of the page as the home-screen icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- No `user-scalable=no`: blocking pinch-zoom is a WCAG 1.4.4 failure, and
         the UI leans on 9-11px type that some users genuinely need to zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Matches the app's default light ground (index.css --ground). Previously
         near-black, which flashed a dark splash before the app painted white. -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Adventure Planner" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="An editorial travel planner — pick a country, choose your destinations, and we craft your full itinerary, flights, hotels and more." />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <title>Adventure Planner — plan your story</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Register the service worker for offline + installability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
